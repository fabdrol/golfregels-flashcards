<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7BD17A"/>
      <stop offset="55%" stop-color="#2F9E5A"/>
      <stop offset="100%" stop-color="#0D4F2C"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="18" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#F4D77B"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#shine)"/>

  <!-- subtle little golf ball motif in corner -->
  <g opacity="0.18" transform="translate(800,800)">
    <circle r="120" fill="#ffffff"/>
    <g fill="#0d4f2c" opacity="0.6">
      <circle cx="-50" cy="-40" r="10"/>
      <circle cx="-10" cy="-60" r="10"/>
      <circle cx="30" cy="-35" r="10"/>
      <circle cx="55" cy="0" r="10"/>
      <circle cx="40" cy="40" r="10"/>
      <circle cx="0" cy="55" r="10"/>
      <circle cx="-45" cy="35" r="10"/>
      <circle cx="-60" cy="-5" r="10"/>
      <circle cx="-15" cy="-15" r="10"/>
      <circle cx="25" cy="15" r="10"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
  </g>

  <!-- GR text -->
  <text x="512" y="640"
        text-anchor="middle"
        font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="540"
        font-style="italic"
        fill="url(#textGrad)"
        filter="url(#textShadow)"
        letter-spacing="-12">GR</text>
</svg>
